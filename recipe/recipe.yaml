schema_version: 1

context:
  name: sqlalchemy
  version: "2.1.0"

recipe:
  name: sqlalchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 37600e4641c435a7e4549f4e6df79d9dfc096bb9712a10dba8925921bc87bc3c

build:
  number: 1

outputs:
  - package:
      name: ${{ name }}
    build:
      script:
        - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - cython >=3.3
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
      host:
        - python
        - pip
        - setuptools >=77.0.3
        - cython >=3.3
      run:
        - python
        - typing_extensions >=4.6.0
        - greenlet >=1
    tests:
      - python:
          imports:
            - sqlalchemy
          pip_check: true
  - package:
      name: ${{ name }}-with-asyncio
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - greenlet >=1
    tests:
      - python:
          imports:
            - sqlalchemy
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
  - package:
      name: ${{ name }}-with-mssql
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, upper_bound='x.x.x.x.x.x') }}
        - pyodbc
    tests:
      - python:
          imports:
            - sqlalchemy
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
  - package:
      name: ${{ name }}-with-mssql-pymssql
    build:
      # noarch so just build it once
      skip: not (linux and x86_64) or match(python, "!=3.10")
